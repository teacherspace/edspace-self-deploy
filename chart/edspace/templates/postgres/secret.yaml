{{- /*
Bundled Postgres superuser password. Hook-scoped (weight -6) so the migrate
hook Job can reference it pre-upgrade, and `lookup`-reused so the password is
stable across upgrades and survives uninstall (hooks are never uninstalled).
*/}}
{{- if .Values.db.bundled.enabled }}
{{- $name := printf "%s-db" (include "edspace.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := dict }}
{{- if $existing }}{{ $existingData = $existing.data | default dict }}{{ end }}
{{- $password := .Values.db.bundled.password | default (get $existingData "postgres-password" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "edspace.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $password | b64enc }}
{{- end }}
