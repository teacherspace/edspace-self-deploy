{{- /*
Bundled Postgres superuser password. This normal retained release resource is
`lookup`-reused so the password is stable across upgrades and reinstalls. The
migration hook runs only on upgrades and references the installed Secret.
*/}}
{{- if .Values.db.bundled.enabled }}
{{- $name := printf "%s-db" (include "edspace.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := dict }}
{{- if $existing }}{{ $existingData = $existing.data | default dict }}{{ end }}
{{- $password := (get $existingData "postgres-password" | b64dec) | default .Values.db.bundled.password | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "edspace.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $password | b64enc }}
{{- end }}
