{{- /*
Generated application secrets, created on first install and reused forever.
This is a normal release resource with Helm's keep policy. The migration Job
runs only on upgrades, so the Secret already exists when that hook starts.
Reinstalling finds and reuses retained values via `lookup`. Explicit secrets.*
values take precedence over generated ones.

GitOps caveat: `helm template` / Argo-style rendering cannot `lookup`, so every
render would mint fresh values — set explicit secrets or existingSecret there
(see NOTES.txt and docs/configuration.md).
*/}}
{{- $s := .Values.secrets }}
{{- if and $s.autoGenerate (not $s.existingSecret) }}
{{- $name := printf "%s-generated" (include "edspace.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := dict }}
{{- if $existing }}{{ $existingData = $existing.data | default dict }}{{ end }}
{{- $skb := $s.secretKeyBase | default (get $existingData "secret-key-base" | b64dec) | default (randAlphaNum 64) }}
{{- $tss := $s.tokenSigningSecret | default (get $existingData "token-signing-secret" | b64dec) | default (randAlphaNum 64) }}
{{- $cookie := $s.releaseCookie | default (get $existingData "release-cookie" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "edspace.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key-base: {{ $skb | b64enc }}
  token-signing-secret: {{ $tss | b64enc }}
  release-cookie: {{ $cookie | b64enc }}
{{- end }}
