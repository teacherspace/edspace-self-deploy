{{- /*
Image pull secret rendered from registryCredentials. This is a normal release
resource, so Helm updates and removes it with the release. The migration hook
runs only on upgrades and uses the already-installed copy.
*/}}
{{- if .Values.registryCredentials.enabled }}
{{- $rc := .Values.registryCredentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edspace.fullname" . }}-registry
  labels:
    {{- include "edspace.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  # Built as a dict + toJson so reserved JSON characters in the credentials
  # cannot break the document.
  .dockerconfigjson: {{ dict "auths" (dict $rc.registry (dict "username" $rc.username "password" $rc.password "auth" (printf "%s:%s" $rc.username $rc.password | b64enc))) | toJson | quote }}
{{- end }}
