{{- /*
Image pull secret rendered from registryCredentials.

Hook-scoped (weight -6) so the migrate hook Job can pull the app image on
first install; persists in the namespace for the regular workloads too.
*/}}
{{- if .Values.registryCredentials.enabled }}
{{- $rc := .Values.registryCredentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edspace.fullname" . }}-registry
  labels:
    {{- include "edspace.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/resource-policy: keep
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" $rc.registry $rc.username $rc.password (printf "%s:%s" $rc.username $rc.password | b64enc) | quote }}
{{- end }}
