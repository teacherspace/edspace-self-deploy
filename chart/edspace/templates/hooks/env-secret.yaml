{{- /* Hook-scoped copy of the env Secret; see hooks/env-configmap.yaml. */}}
{{- if .Values.migrate.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edspace.fullname" . }}-hook-env
  labels:
    {{- include "edspace.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- include "edspace.envSecretData" . | nindent 2 }}
{{- end }}
