{{- /*
Database migrations as a pre-upgrade Helm hook: a failed migration aborts the
upgrade while the old pods keep serving. On first install, the app migrates at
boot so all release-owned Secrets and ConfigMaps can follow a normal lifecycle.
*/}}
{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "edspace.fullname" . }}-migrate
  labels:
    {{- include "edspace.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  # Keep failed Jobs briefly for diagnosis, then let the TTL controller
  # remove them (successful runs are deleted by the hook policy).
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "edspace.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "edspace.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "edspace.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/bin/migrate"]
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "edspace.migrationInlineConfigEnv" . | nindent 12 }}
            {{- include "edspace.sharedEnv" . | nindent 12 }}
            # Small pool; no Chromium — migrations don't render PDFs.
            - name: POOL_SIZE
              value: "2"
            - name: POOL_COUNT
              value: "1"
            - name: PDF_ENABLED
              value: "false"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "edspace.fullname" . }}-migrate-env
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if and (eq .Values.mailer.adapter "smtp") .Values.mailer.smtp.caCertSecret }}
          volumeMounts:
            {{- include "edspace.mailerCaVolumeMount" . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      {{- if and (eq .Values.mailer.adapter "smtp") .Values.mailer.smtp.caCertSecret }}
      volumes:
        {{- include "edspace.mailerCaVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
