{{- /*
Secret env for the pre-upgrade migration Job. Hook resources are rendered
fresh each upgrade, so the Job sees the NEW values while the release Secret
still holds the previous revision's data. Deleted after the hook succeeds or
fails so credentials never linger; before-hook-creation covers interrupted
runs. The Job's pods read env at start, so deletion cannot race them.
*/}}
{{- if .Values.migrate.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edspace.fullname" . }}-migrate-env
  labels:
    {{- include "edspace.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
type: Opaque
stringData:
  {{- include "edspace.envSecretData" . | nindent 2 }}
{{- end }}
