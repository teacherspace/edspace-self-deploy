# Default values for the EdSpace chart.
# Full setting reference: docs/configuration.md and docs/env-vars.md in the
# edspace-deploy repository. values.schema.json validates this structure and
# enforces the install-time invariants (app.host, database, secrets).

app:
  # -- Public hostname the app is served on (PHX_HOST). Required.
  host: ""
  # -- WebSocket origin check override (PHX_CHECK_ORIGIN). Empty = derived from host.
  checkOrigin: ""

image:
  # -- App image. Overridable for air-gapped mirrors.
  repository: edspace.azurecr.io/edspace/edspace
  # -- Image tag; defaults to the chart appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Pre-created image pull secrets, e.g. [{name: my-pull-secret}].
imagePullSecrets: []

registryCredentials:
  # -- Render a dockerconfigjson pull Secret from the credentials below.
  enabled: false
  # -- Registry host the credentials apply to.
  registry: edspace.azurecr.io
  # -- Per-customer registry username.
  username: ""
  # -- Per-customer registry token.
  password: ""

# -- Number of app replicas. >1 requires clustering.enabled (default on) and
# non-local file storage (see storage.adapter).
replicaCount: 1

db:
  bundled:
    # -- Run an in-cluster Postgres (pgvector). EVALUATION ONLY — no backups,
    # no replication. Use an external managed Postgres in production.
    enabled: false
    # -- Postgres image; must provide the pgvector extension. Pinned to a
    # released pgvector version — keep the pin when overriding.
    image: pgvector/pgvector:0.8.5-pg16
    database: edspace
    username: edspace
    # -- Superuser password for first install. Empty = generated. The retained
    # Secret wins on upgrades/reinstalls so changing this cannot desync the DB.
    password: ""
    persistence:
      size: 10Gi
      storageClass: ""
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { memory: 1Gi }
  # External database (used when bundled.enabled is false).
  # Requires Postgres >= 16.3 with the vector, citext and pg_trgm extensions
  # available — see docs/database.md.
  host: ""
  port: 5432
  database: edspace
  username: edspace
  # -- Database password rendered into the chart-managed Secret (mode a).
  password: ""
  # -- "require" appends ?ssl=true to the composed DATABASE_URL. See
  # docs/database.md for the app's current TLS limitations.
  sslMode: ""
  # -- Existing Secret with database credentials (modes b/c); takes precedence
  # over db.password.
  existingSecret: ""
  existingSecretKeys:
    # -- Key holding a complete ecto:// URL (mode b).
    url: ""
    # -- Key holding only the password (mode c; composed with db.host etc.).
    # Passwords containing URL-reserved characters must be pre-encoded.
    password: ""

secrets:
  # -- Generate SECRET_KEY_BASE / TOKEN_SIGNING_SECRET / RELEASE_COOKIE on
  # first install and keep them across upgrades AND uninstalls. Fine for
  # pilots; for GitOps (Argo/Flux) or production set explicit values or
  # existingSecret — template-only rendering cannot reuse generated values.
  autoGenerate: true
  secretKeyBase: ""
  tokenSigningSecret: ""
  # -- Erlang distribution cookie; only used when clustering.enabled.
  releaseCookie: ""
  # -- First-run setup token (EDSPACE_SETUP_TOKEN), `<yyyyMMddHHmmss>.<random>`.
  # Generated on first install when autoGenerate is on; the install notes print
  # the /setup link. Set explicitly to mint a fresh one (valid 7 days from the
  # embedded time, ignored once a platform admin exists).
  setupToken: ""
  # -- Existing Secret holding the three keys below.
  existingSecret: ""
  existingSecretKeys:
    secretKeyBase: secret-key-base
    tokenSigningSecret: token-signing-secret
    releaseCookie: release-cookie

storage:
  # -- Attachment storage backend: local_disk (needs persistence) or azure_blob.
  adapter: local_disk
  localDisk:
    # -- Mount path / EDSPACE_FILE_STORAGE_ROOT.
    root: /app/uploads
    persistence:
      # -- Persist uploads in a PVC. Disabling loses uploads on restart.
      enabled: true
      size: 20Gi
      storageClass: ""
      # -- ReadWriteOnce restricts to replicaCount 1 (schema-enforced); use an
      # RWX class or azure_blob for multiple replicas.
      accessModes: [ReadWriteOnce]
      existingClaim: ""
  azureBlob:
    # -- Storage account name (AZURE_STORAGE_ACCOUNT).
    account: ""
    # -- Blob container, must already exist (AZURE_STORAGE_CONTAINER).
    container: ""
    # -- Account key; prefer existingSecret.
    key: ""
    existingSecret: ""
    existingSecretKey: azure-storage-key

llm:
  # -- LLM provider (EDSPACE_LLM_PROVIDER): azure, openai, anthropic, ...
  provider: azure
  # -- API key; prefer existingSecret.
  apiKey: ""
  existingSecret: ""
  existingSecretKey: llm-api-key
  # -- Provider endpoint (EDSPACE_LLM_BASE_URL); required for azure.
  baseUrl: ""
  # -- Azure OpenAI API version.
  apiVersion: ""
  # -- provider:model overrides; empty = app defaults.
  textModel: ""
  # -- Azure deployment name for the text model.
  textDeployment: ""
  smallModel: ""
  smallDeployment: ""
  embeddingModel: ""
  embeddingDeployment: ""

mailer:
  # -- Delivery backend: `mailpace`, `smtp`, or `none`. With `none` the app
  # sends nothing: sign-in falls back to passwords and/or SSO, and invitation
  # links are shown to the inviting admin to pass on by hand. Pick it for a
  # deployment whose users all arrive over SSO or a roster feed.
  adapter: mailpace
  # -- Sender address (MAILER_FROM_EMAIL), verified with the provider.
  # Required unless adapter is `none`.
  fromEmail: ""
  fromName: ""
  # -- MailPace API token, for adapter `mailpace`. Prefer existingSecret.
  mailpaceApiKey: ""
  # -- Settings for adapter `smtp`. Leave `tls`/`auth` empty to keep the
  # application's own defaults, which depend on `ssl` and `username`:
  # mandatory STARTTLS unless `ssl` is on, and authentication once a
  # username is set.
  smtp:
    relay: ""
    port: 587
    username: ""
    password: ""
    ssl: false
    tls: ""
    auth: ""
    tlsVerify: true
    # -- Existing Secret containing a PEM CA bundle for an internal SMTP
    # relay. The chart mounts it read-only and sets MAILER_SMTP_CACERTFILE.
    caCertSecret: ""
    # -- Key inside caCertSecret containing the PEM bundle.
    caCertSecretKey: ca.crt
    # -- CA path already present in a custom image. Mutually exclusive with
    # caCertSecret; ordinary installs should prefer the mounted Secret above.
    caCertFile: ""
    noMxLookups: true
  # -- Customer-managed Secret holding the mailer credential: the MailPace
  # API key, or the SMTP password when adapter is `smtp`.
  existingSecret: ""
  # -- Key inside existingSecret. Empty resolves per adapter:
  # `mailpace-api-key` for `mailpace`, `smtp-password` for `smtp`.
  existingSecretKey: ""

# -- Extra non-secret env vars (validated against the app contract). Speech is
# disabled by default in self-deploy because it needs separate Azure Speech
# credentials; set true plus AZURE_SPEECH_KEY/REGION to enable it.
env:
  EDSPACE_SPEECH_ENABLED: "false"
# -- Extra secret env vars (validated; rendered into the app Secret).
envSecret: {}
# -- Raw envFrom entries (customer-managed ConfigMaps/Secrets, ESO, CSI...).
extraEnvFrom: []
# -- Raw corev1.EnvVar entries appended to the app container.
extraEnv: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  # -- Extra ingress annotations; the chart adds none by default.
  annotations: {}
  # -- Ingress host; defaults to app.host.
  host: ""
  path: /
  pathType: Prefix
  tls:
    enabled: true
    # -- Existing TLS Secret name (used verbatim). Empty + certManager off =
    # <fullname>-tls (bring your own contents).
    secretName: ""
    certManager:
      # -- Add the cert-manager issuer annotation and let it populate the TLS secret.
      enabled: false
      issuer: ""
      issuerKind: ClusterIssuer

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    # No CPU limit: CFS throttling collapses BEAM schedulers. If your policy
    # requires one, also pin schedulers via extraEnv ERL_FLAGS "+S <n>".
    memory: 2Gi

probes:
  # Liveness deliberately avoids /health (DB-coupled): a DB outage must not
  # restart-loop the app.
  liveness:
    enabled: true
    path: /version
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # Startup budget covers migrations running before the server binds.
  startup:
    enabled: true
    path: /health
    periodSeconds: 5
    failureThreshold: 30

clustering:
  # -- Wire Erlang clustering (headless service + DNS_CLUSTER_QUERY +
  # RELEASE_NODE/RELEASE_COOKIE). Required for replicaCount > 1.
  enabled: true

lifecycle:
  # -- Must exceed the app's socket-drain budget (SOCKET_DRAINER_SHUTDOWN_MS, 30s).
  terminationGracePeriodSeconds: 45

strategy:
  type: RollingUpdate
  rollingUpdate:
    # -- Zero surge is required by the default ReadWriteOnce uploads PVC.
    # Blob/RWX installs can override to maxSurge: 1, maxUnavailable: 0.
    maxSurge: 0
    maxUnavailable: 1

migrate:
  # -- Run migrations as a pre-upgrade Job so a failed migration aborts before
  # pods roll. First install migrates at app boot.
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

seed:
  # -- Demo/seed data Job (post-install AND post-upgrade). Re-runs on every
  # upgrade while enabled — disable again after seeding.
  enabled: false
  activeDeadlineSeconds: 900
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 2Gi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: null
  behavior: {}

pdb:
  enabled: false
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # -- The app never calls the Kubernetes API.
  automount: false

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  # No readOnlyRootFilesystem: Chromium (PDF export) and upload staging write
  # to the container filesystem.

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# -- Cluster DNS domain, used for the DNS_CLUSTER_QUERY value.
clusterDomain: cluster.local
nameOverride: ""
fullnameOverride: ""
