  # -------------------------------------------------------------- telemetry
  - name: LANGFUSE_PUBLIC_KEY
    category: telemetry
    description: >-
      Langfuse public key. LLM tracing activates only when
      LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY and LANGFUSE_HOST are all set;
      leave empty to disable tracing.
    type: string
    required: false
    secret: false
    tier: core
    source: user

  - name: LANGFUSE_SECRET_KEY
    category: telemetry
    description: Langfuse secret key.
    type: string
    required: false
    secret: true
    tier: core
    source: user

  - name: LANGFUSE_HOST
    category: telemetry
    description: Langfuse host receiving OpenTelemetry traces (your own Langfuse instance).
    type: string
    required: false
    secret: false
    tier: core
    source: user
    example: https://langfuse.school.example

  - name: LANGFUSE_BASE_URL
    category: telemetry
    description: >-
      Langfuse REST API base URL — the read/query side (prompt fetches, usage
      and fair-use lookups), separate from the OTLP span exporter. Falls back
      to LANGFUSE_HOST, so one host variable can drive both the push and pull
      paths, and then to Langfuse's public cloud: an install that sets
      LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY without either host variable
      sends its queries to cloud.langfuse.com. Point this at your own
      instance, or leave all three unset.
    type: string
    default:
      app: https://cloud.langfuse.com
    required: false
    secret: false
    tier: advanced
    source: user
    notes: >-
      Trace export is unaffected — it activates only when LANGFUSE_HOST is set
      alongside both keys.

  - name: LANGFUSE_BASEURL
    category: telemetry
    description: Legacy alias of LANGFUSE_BASE_URL.
    type: string
    required: false
    secret: false
    tier: internal
    source: user

  - name: LANGFUSE_ENVIRONMENT
    category: telemetry
    description: deployment.environment tag on emitted traces.
    type: string
    required: false
    secret: false
    tier: advanced
    source: user
    example: production

  - name: LANGFUSE_RELEASE
    category: telemetry
    description: service.version tag on emitted traces.
    type: string
    required: false
    secret: false
    tier: advanced
    source: user

  - name: LANGFUSE_TIMEOUT
    category: telemetry
    description: >-
      Langfuse REST client timeout in SECONDS — integer or float, not
      milliseconds. The effective default is 5 seconds; a value like 5000
      would mean 5000 seconds, and a non-numeric value raises.
    type: string
    default: { app: 5 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: EDSPACE_OTEL_LLM_PAYLOADS
    category: telemetry
    description: >-
      Whether prompt/completion text is included in telemetry spans. Set to
      "none" to strip payloads (recommended when traces leave your
