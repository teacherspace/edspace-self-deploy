# EdSpace environment-variable contract.
#
# Single source of truth for every environment variable the app reads.
# Generated surfaces (run `make gen` after editing):
#   - compose/.env.example
#   - chart/edspace/values.schema.json (env/envSecret passthrough validation)
#   - docs/env-vars.md
#
# Field reference:
#   type:     string | integer | boolean | enum   (wire format is always a string)
#   required: bool, or {chart: bool, compose: bool} for per-context requiredness
#             — "required for that context's DEFAULT configuration", which is
#             what .env.example renders uncommented
#   required_when: free text spelling out a CONDITIONAL requirement (e.g. only
#             with a particular adapter). Rendered into both customer surfaces;
#             cannot be combined with a flat `required: true`
#   secret:   true -> must live in a Secret / PasswordBox, never a ConfigMap or plain env
#   default:  scalar (app compiled-in), or {app:, chart:, compose:} when packaging overrides
#   tier:     core     -> shown uncommented in .env.example; primary docs
#             advanced -> commented out in .env.example; documented
#             internal -> tuning/plumbing; excluded from customer surfaces (still settable)
#   source:   user     -> customer provides or accepts default
#             computed -> derived by the packaging layer (chart/compose/managed app)
#             fixed    -> pinned by the packaging layer / image
#
# Provenance: config/runtime.exs, lib/edspace/repo/pool_config.ex,
# lib/edspace_web/endpoint.ex, rel/env.sh.eex, Dockerfile of the app repo.

version: 1

categories:
  - id: phoenix
    title: Core Phoenix / HTTP
  - id: database
    title: Database
  - id: storage
    title: File storage
  - id: llm
    title: LLM provider
  - id: llm-pools
    title: LLM connection pools
  - id: chat-limits
    title: Chat limits & admission control
  - id: speech
    title: Speech (Azure Cognitive Services)
  - id: mailer
    title: Mailer
  - id: auth
    title: Authentication / OIDC
  - id: retention
    title: Member retention & purge
  - id: pdf
    title: PDF export
  - id: telemetry
    title: Telemetry (Langfuse / OpenTelemetry)
  - id: lifecycle
    title: Shutdown & socket draining
  - id: beam
    title: BEAM / OS tuning
  - id: deploy
    title: Deployment settings (not read by the app)

# Variables the application reads that are deliberately OUTSIDE the customer
# contract, each with the reason. `scripts/check-contract-parity.py` reads this
# list so it can tell an intentional omission from drift — when the app grows a
# variable, it either lands in `vars:` below or gets a line here.
#
# A customer who genuinely needs one of these supplies it through the chart's
# extraEnv/extraEnvFrom (or straight into compose/.env), which bypass the
# contract's schema validation by design.
excluded:
  - prefix: ALICE_
    reason: >-
      Alice (L&R/Alinea licence system) roster-sync credentials and tuning.
      EdSpace-operated integration; values are issued during onboarding and
      the integration is inert without them.
  - prefix: ALINEA_
    reason: >-
      Alinea publisher SSO and licence service. Same posture as ALICE_ —
      EdSpace-configured, per-environment, not a customer setting.
  - prefix: LINEAR_
    reason: In-app feedback push to EdSpace's own Linear workspace.
  - prefix: DD_
    reason: >-
      Datadog APM/RUM for EdSpace-operated environments. A self-hosting
      customer collects the app's stdout JSON logs and OTLP traces instead.
  - prefix: EDSPACE_DD_
    reason: DogStatsD/OTLP transport details for the Datadog agent above.
  - prefix: TEACHERSPACE_SOURCE_
    reason: >-
      Read-only connection to a restored copy of the legacy Teacherspace
      database, used only by the one-time data migration.
  - name: GIT_SHA
    reason: Build-stamp fallback for the Datadog RUM release version.
  - name: MIX_TEST_PARTITION
    reason: Test-suite only.
  - name: TEST_DB_POOL_SIZE
    reason: Test-suite only.
  # Settings below are runtime-editable on the backoffice Platform settings
  # page (the platform_settings singleton row), which is the supported way to
  # change them — no restart, applies to every node, and the backoffice shows
  # the effective value. The env vars still exist in the app as
  # deployment-time defaults underneath the DB row, but they are deliberately
  # not part of the customer contract.
  - prefix: EDSPACE_CHAT_TOOLS_
    reason: >-
      Chat tool rollout switches. Managed at runtime on the backoffice
      Platform settings page; a save applies on the next message with no
      restart, which is the whole point of a kill switch.
  - name: EDSPACE_FAIR_USE_MONTHLY_TOKENS_PER_USER
    reason: >-
      Contractual fair-use allowance. Managed on the backoffice Platform
      settings page — it changes when contracts change, not when
      deployments do.
  - name: MEMBER_PURGE_GLOBAL_CAP
    reason: >-
      Member-purge safeguard, managed on the backoffice Platform settings
      page next to the purge-run reports it should be tuned against.
  - name: MEMBER_PURGE_STALE_SYNC_HOURS
    reason: Member-purge safeguard, managed on the Platform settings page.
  - name: MEMBER_PURGE_RETENTION_NOTICE_DAYS
    reason: Member-purge safeguard, managed on the Platform settings page.
  - name: MEMBER_PURGE_ABANDON_AFTER_MINUTES
    reason: Member-purge safeguard, managed on the Platform settings page.
  - name: EDSPACE_SPEECH_VOICE
    reason: >-
      Read-aloud voice, a product preference managed on the Platform
      settings page.
  - name: EDSPACE_SPEECH_RECOGNITION_LANGUAGE
    reason: Dictation language, managed on the Platform settings page.
  - name: EDSPACE_SPEECH_RECOGNITION_LANGUAGES
    reason: Dictation language menu, managed on the Platform settings page.
  - name: DEBUG_AUTH_FAILURES
    reason: >-
      Sign-in diagnostics logging leaks personal data, so the supported way
      to turn it on is the time-boxed window on the Platform settings page,
      which switches itself off. The env var remains as a boot-time default
      for EdSpace-operated staging, where it is set and unset by hand.

vars:
  # ---------------------------------------------------------------- phoenix
  - name: PHX_HOST
    category: phoenix
    description: >-
      Public hostname the app is served on. Drives generated URLs and the
      default WebSocket origin check.
    type: string
    required: true
    secret: false
    tier: core
    source: user
    example: edspace.school.example

  - name: SECRET_KEY_BASE
    category: phoenix
    description: >-
      Random string (64+ chars) used to sign/encrypt cookies and session
      data. Generate with scripts/generate-secrets.sh. Changing it
      invalidates all active sessions.
    type: string
    required: true
    secret: true
    tier: core
    source: user

  - name: TOKEN_SIGNING_SECRET
    category: phoenix
    description: >-
      Random string used to sign authentication tokens. Generate with
      scripts/generate-secrets.sh. Changing it invalidates issued tokens.
    type: string
    required: true
    secret: true
    tier: core
    source: user

  - name: PHX_CHECK_ORIGIN
    category: phoenix
    description: >-
      WebSocket origin check. Unset, the app allows "//" + PHX_HOST. Set to
      a comma-separated list of origins, or "false" to disable (not
      recommended).
    type: string
    required: false
    secret: false
    tier: advanced
    source: user
    example: https://edspace.school.example,https://alias.school.example

  - name: PHX_SERVER
    category: phoenix
    description: Starts the HTTP server under a mix release. Set by the image.
    type: boolean
    default: { app: false, chart: true, compose: true }
    required: false
    secret: false
    tier: internal
    source: fixed

  - name: PORT
    category: phoenix
    description: HTTP listen port inside the container.
    type: integer
    default: { app: 4000, chart: 4000, compose: 4000 }
    required: false
    secret: false
    tier: internal
    source: fixed

  - name: DNS_CLUSTER_QUERY
    category: phoenix
    description: >-
      DNS name polled by dns_cluster to discover peer nodes. Set
      automatically by the Helm chart (headless service) when clustering is
      enabled. Required whenever more than one replica runs, otherwise
      LiveView/PubSub events stay node-local.
    type: string
    required: false
    secret: false
    tier: internal
    source: computed

  # --------------------------------------------------------------- database
  - name: DATABASE_URL
    category: database
    description: >-
      Ecto connection URL, ecto://USER:PASS@HOST:PORT/DB. Composed
      automatically by the chart/compose/managed app from structured
      database settings; do not set directly.
    type: string
    required: true
    secret: true
    tier: core
    source: computed

  - name: ECTO_IPV6
    category: database
    description: Set to "true" to connect to Postgres over IPv6.
    type: boolean
    default: { app: false }
    required: false
    secret: false
    tier: advanced
    source: user

  - name: POOL_SIZE
    category: database
    description: >-
      Ecto connections per pool. Effective connections per node =
      POOL_SIZE x POOL_COUNT (default 30x2 = 60). Keep
      replicas x POOL_SIZE x POOL_COUNT below Postgres max_connections.
    type: integer
    default: { app: 30 }
    required: false
    secret: false
    tier: advanced
    source: user

  - name: POOL_COUNT
    category: database
    description: Number of Ecto pools per node (see POOL_SIZE).
    type: integer
    default: { app: 2 }
    required: false
    secret: false
    tier: advanced
    source: user

  - name: DB_QUEUE_TARGET_MS
    category: database
    description: DBConnection queue_target — checkout queue latency target.
    type: integer
    default: { app: 50 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: DB_QUEUE_INTERVAL_MS
    category: database
    description: DBConnection queue_interval for backpressure measurement.
    type: integer
    default: { app: 1000 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: DB_TIMEOUT_MS
    category: database
    description: DBConnection checkout timeout.
    type: integer
    default: { app: 15000 }
    required: false
    secret: false
    tier: internal
    source: user

  # ---------------------------------------------------------------- storage
  - name: EDSPACE_FILE_STORAGE_ADAPTER
    category: storage
    description: >-
      Attachment storage backend. "local_disk" stores under
      EDSPACE_FILE_STORAGE_ROOT (needs a persistent volume); "azure_blob"
      requires AZURE_STORAGE_ACCOUNT/CONTAINER/KEY — if any of the three is
      missing the app silently falls back to local disk.
    type: enum
    enum: [local_disk, azure_blob]
    default: { app: local_disk, compose: local_disk }
    required: false
    secret: false
    tier: core
    source: user

  - name: EDSPACE_FILE_STORAGE_ROOT
    category: storage
    description: Root directory for the local_disk adapter.
    type: string
    default: { app: priv/uploads, chart: /app/uploads, compose: /app/uploads }
    required: false
    secret: false
    tier: advanced
    source: user

  - name: AZURE_STORAGE_ACCOUNT
    category: storage
    description: Azure Blob storage account name (azure_blob adapter).
    type: string
    required: false
    secret: false
    tier: core
    source: user
    example: stoedspaceprod

  - name: AZURE_STORAGE_CONTAINER
    category: storage
    description: Azure Blob container for uploads (must already exist).
    type: string
    required: false
    secret: false
    tier: core
    source: user
    example: uploads

  - name: AZURE_STORAGE_KEY
    category: storage
    description: Azure Blob storage account access key (azure_blob adapter).
    type: string
    required: false
    secret: true
    tier: core
    source: user

  # -------------------------------------------------------------------- llm
  - name: EDSPACE_LLM_PROVIDER
    category: llm
    description: LLM provider used for chat, generation and embeddings.
    type: enum
    enum: [azure, openai, anthropic, google, groq, mistral, openrouter, deepseek, deepinfra, cerebras, xai, amazon_bedrock]
    default: { app: azure }
    required: false
    secret: false
    tier: core
    source: user

  - name: EDSPACE_LLM_API_KEY
    category: llm
    description: >-
      API key for the configured LLM provider. Effectively required — the
      product's core features depend on it. (The Azure-style fallbacks
      AZURE_OPENAI_API_KEY / AZURE_API_KEY are also honoured.)
    type: string
    required: true
    secret: true
    tier: core
    source: user

  - name: EDSPACE_LLM_BASE_URL
    category: llm
    description: >-
      Provider base URL. Required for azure (your Azure OpenAI / AI Foundry
      endpoint); usually left empty for public providers.
    type: string
    required: false
    secret: false
    tier: core
    source: user
    example: https://example.cognitiveservices.azure.com/

  - name: EDSPACE_LLM_API_VERSION
    category: llm
    description: Azure OpenAI API version, when the provider is azure.
    type: string
    required: false
    secret: false
    tier: advanced
    source: user
    example: "2024-10-21"

  - name: EDSPACE_LLM_TEXT_MODEL
    category: llm
    description: Main text model, "provider:model" form.
    type: string
    default: { app: "azure:gpt-5.6-sol" }
    required: false
    secret: false
    tier: core
    source: user
    notes: >-
      Precedence: a model saved on the backoffice Platform settings page
      (the `platform_settings` table) overrides this variable, and also pins
      the matching EDSPACE_LLM_TEXT_DEPLOYMENT from the model registry so a
      stale deployment name cannot pair with the newly selected model. Clear
      the setting there to fall back to this variable.


  - name: EDSPACE_LLM_TEXT_DEPLOYMENT
    category: llm
    description: Azure deployment name serving the main text model (azure only).
    type: string
    required: false
    secret: false
    tier: core
    source: user
    example: gpt-5.6-sol

  - name: EDSPACE_LLM_SMALL_MODEL
    category: llm
    description: Small/fast model for lightweight tasks, "provider:model" form.
    type: string
    default: { app: "azure:gpt-5.6-luna" }
    required: false
    secret: false
    tier: advanced
    source: user
    notes: >-
      Overridden by the backoffice Platform settings page in the same way as
      EDSPACE_LLM_TEXT_MODEL, pinning EDSPACE_LLM_SMALL_DEPLOYMENT with it.


  - name: EDSPACE_LLM_SMALL_DEPLOYMENT
    category: llm
    description: Azure deployment name serving the small model (azure only).
    type: string
    required: false
    secret: false
    tier: core
    source: user
    example: gpt-5.6-luna

  - name: EDSPACE_LLM_EMBEDDING_MODEL
    category: llm
    description: >-
      Embedding model for retrieval/RAG, "provider:model" form. Must produce
      1536-dimension vectors (database schema is fixed to 1536).
    type: string
    default: { app: "azure:text-embedding-3-small" }
    required: false
    secret: false
    tier: advanced
    source: user

  - name: EDSPACE_LLM_EMBEDDING_DEPLOYMENT
    category: llm
    description: Azure deployment name serving the embedding model (azure only).
    type: string
    required: false
    secret: false
    tier: core
    source: user
    example: text-embedding-3-small

  - name: AZURE_OPENAI_API_KEY
    category: llm
    description: Fallback alias for EDSPACE_LLM_API_KEY (azure provider).
    type: string
    required: false
    secret: true
    tier: advanced
    source: user
    notes: Prefer EDSPACE_LLM_API_KEY; this alias exists for Azure-conventional setups.

  - name: AZURE_OPENAI_BASE_URL
    category: llm
    description: Fallback alias for EDSPACE_LLM_BASE_URL (azure provider).
    type: string
    required: false
    secret: false
    tier: advanced
    source: user
    notes: Prefer EDSPACE_LLM_BASE_URL.

  - name: AZURE_API_KEY
    category: llm
    description: Second fallback alias for EDSPACE_LLM_API_KEY.
    type: string
    required: false
    secret: true
    tier: internal
    source: user

  - name: AZURE_BASE_URL
    category: llm
    description: Second fallback alias for EDSPACE_LLM_BASE_URL.
    type: string
    required: false
    secret: false
    tier: internal
    source: user

  # -------------------------------------------------------------- llm-pools
  - name: REQ_LLM_POOL_SIZE
    category: llm-pools
    description: Finch pool size for streamed LLM calls.
    type: integer
    default: { app: 50 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: REQ_LLM_POOL_COUNT
    category: llm-pools
    description: Finch pool count for streamed LLM calls.
    type: integer
    default: { app: 8 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: REQ_LLM_STRUCTURED_POOL_SIZE
    category: llm-pools
    description: Finch pool size for structured (sync) LLM calls.
    type: integer
    default: { app: 20 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: REQ_LLM_STRUCTURED_POOL_COUNT
    category: llm-pools
    description: Finch pool count for structured (sync) LLM calls.
    type: integer
    default: { app: 4 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: REQ_LLM_BULK_POOL_SIZE
    category: llm-pools
    description: Finch pool size for bulk embedding calls.
    type: integer
    default: { app: 20 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: REQ_LLM_BULK_POOL_COUNT
    category: llm-pools
    description: Finch pool count for bulk embedding calls.
    type: integer
    default: { app: 5 }
    required: false
    secret: false
    tier: internal
    source: user

  # ------------------------------------------------------------ chat-limits
  - name: MAX_CONCURRENT_STREAMS
    category: chat-limits
    description: Per-node cap on in-flight chat turns.
    type: integer
    default: { app: 2000 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: MAX_CONCURRENT_CREATION_SESSIONS
    category: chat-limits
    description: Per-node cap on concurrent assistant-builder sessions.
    type: integer
    default: { app: 1000 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: MAX_CONCURRENT_BACKGROUND_TASKS
    category: chat-limits
    description: Per-node cap on post-turn background tasks.
    type: integer
    default: { app: 1000 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: HISTORY_MESSAGE_WINDOW
    category: chat-limits
    description: Maximum stored messages hydrated per chat turn.
    type: integer
    default: { app: 500 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: EDSPACE_CHAT_MAX_TOTAL_CACHED_CHARS
    category: chat-limits
    description: Ceiling on cached retrieval characters per conversation.
    type: integer
    default: { app: 400000 }
    required: false
    secret: false
    tier: internal
    source: user

  - name: EDSPACE_CHAT_MAX_HISTORY_CHARS
    category: chat-limits
    description: Ceiling on history characters hydrated per turn.
    type: integer
    default: { app: 1200000 }
    required: false
    secret: false
    tier: internal
    source: user

  # ----------------------------------------------------------------- speech
  - name: EDSPACE_SPEECH_ENABLED
    category: speech
    description: >-
      Deployment default for the speech features (STT/TTS). Requires the
      AZURE_SPEECH_* settings when enabled; the packaging sets it to "false"
      until an Azure Speech resource is provided.
    type: boolean
    default: { app: true, chart: false, compose: false }
    required: false
    secret: false
    tier: core
    source: user
    notes: >-
      A platform admin can switch speech on or off at runtime on the
      backoffice Platform settings page, which overrides this variable; the
      page also says when the credentials are missing. The voice and
      dictation languages are managed there only (see `excluded:`).

  - name: AZURE_SPEECH_KEY
    category: speech
    description: Azure Cognitive Services Speech API key.
    type: string
    required: false
    secret: true
    tier: core
    source: user

  - name: AZURE_SPEECH_REGION
    category: speech
    description: Azure Speech resource region.
    type: string
    required: false
    secret: false
    tier: core
    source: user
    example: swedencentral

  - name: AZURE_SPEECH_ENDPOINT
    category: speech
    description: Azure Speech endpoint override.
    type: string
    required: false
    secret: false
    tier: advanced
    source: user

  # ----------------------------------------------------------------- mailer
  # Transactional email is OPTIONAL. EdSpace sends exactly three messages, all
  # about getting into an account (magic-link sign-in, password reset,
  # invitation), so a deployment that provisions its users over SSO or a roster
  # feed can run with MAILER_ADAPTER=none. Every mode validates its own inputs
  # and raises at boot rather than dropping sign-in links at runtime.
  - name: MAILER_ADAPTER
    category: mailer
    description: >-
      Transactional-email backend. "mailpace" uses the MailPace HTTP API,
      "smtp" any SMTP relay, "none" disables email entirely — sign-in then
      uses passwords and/or SSO, and invitation links are shown to the
      inviting admin to pass on by hand.
    type: enum
    enum: [mailpace, smtp, none]
    default: { app: mailpace }
    required: false
    secret: false
    tier: core
    source: user
    notes: >-
      The app also accepts "local" (Swoosh's in-memory /dev/mailbox), which is
      refused in production and therefore not offered here.

  - name: MAILER_FROM_EMAIL
    category: mailer
    description: >-
      From address for transactional email. Must be a sender address verified
      with the provider — MailPace rejects every message otherwise, and most
      relays refuse the envelope.
    type: string
    required: { chart: false, compose: true }
    required_when: >-
      MAILER_ADAPTER is "mailpace" or "smtp" (blank counts as missing and
      fails at boot); not read with "none"
    secret: false
    tier: core
    source: user
    example: noreply@school.example

  - name: MAILER_FROM_NAME
    category: mailer
    description: >-
      Deployment default for the From display name on transactional email.
    type: string
    default: { app: EdSpace }
    required: false
    secret: false
    tier: advanced
    source: user
    notes: >-
      Also editable at runtime on the backoffice Platform settings page,
      which overrides this variable.

  - name: MAILPACE_API_KEY
    category: mailer
    description: MailPace API token.
    type: string
    required: { chart: false, compose: true }
    required_when: MAILER_ADAPTER=mailpace (the default)
    secret: true
    tier: core
    source: user

  - name: MAILER_SMTP_RELAY
    category: mailer
    description: SMTP relay hostname. Configured explicitly, so no MX lookup is done on it.
    type: string
    required: false
    required_when: MAILER_ADAPTER=smtp
    secret: false
    tier: core
    source: user
    example: smtp.school.example

  - name: MAILER_SMTP_PORT
    category: mailer
    description: >-
      SMTP relay port. 587 is the STARTTLS submission port; use 465 together
      with MAILER_SMTP_SSL=true for implicit TLS.
    type: integer
    default: { app: 587 }
    required: false
    secret: false
    tier: core
    source: user

  - name: MAILER_SMTP_USERNAME
    category: mailer
    description: >-
      SMTP username. Setting it flips MAILER_SMTP_AUTH to "always" — a relay
      given credentials is expected to use them.
    type: string
    required: false
    secret: false
    tier: core
    source: user

  - name: MAILER_SMTP_PASSWORD
    category: mailer
    description: SMTP password for MAILER_SMTP_USERNAME.
    type: string
    required: false
    required_when: the relay authenticates (i.e. MAILER_SMTP_USERNAME is set)
    secret: true
    tier: core
    source: user

  - name: MAILER_SMTP_SSL
    category: mailer
    description: >-
      Implicit TLS from the first byte, usually on port 465. Leave false for
      the ordinary STARTTLS submission port.
    type: boolean
    default: { app: false }
    required: false
    secret: false
    tier: advanced
    source: user

  - name: MAILER_SMTP_TLS
    category: mailer
    description: >-
      STARTTLS policy. Mandatory by default: with "if_available" a relay that
      does not advertise STARTTLS — or anyone in the middle stripping the
      capability — gets the session in cleartext, credentials and sign-in
      links included. Set "never" only for a relay on a trusted network.
    type: enum
    enum: [always, never, if_available]
    default: { app: always }
    required: false
    secret: false
    tier: advanced
    source: user
    notes: >-
      The default flips to "never" when MAILER_SMTP_SSL=true, where the
      session is already encrypted and STARTTLS is never offered.

  - name: MAILER_SMTP_AUTH
    category: mailer
    description: >-
      SMTP authentication policy. Defaults to "always" when
      MAILER_SMTP_USERNAME is set and "if_available" when it is not.
    type: enum
    enum: [always, never, if_available]
    default: { app: if_available }
    required: false
    secret: false
    tier: advanced
    source: user

  - name: MAILER_SMTP_TLS_VERIFY
    category: mailer
    description: >-
      Verify the relay's TLS certificate against the OS trust store. Setting
      it false disables verification entirely — only safe for a relay you
      control on a trusted network, never across the public internet.
    type: boolean
    default: { app: true }
    required: false
    secret: false
    tier: advanced
    source: user

  - name: MAILER_SMTP_CACERTFILE
    category: mailer
    description: >-
      Path to a PEM CA bundle to verify the relay against, for an internal CA
      or an image without an OS trust store. Boot fails if the path does not
      exist.
    type: string
    required: false
    secret: false
    tier: advanced
    source: user
    example: /etc/ssl/certs/internal-ca.pem

  - name: MAILER_SMTP_NO_MX_LOOKUPS
    category: mailer
    description: >-
      Skip the MX lookup on MAILER_SMTP_RELAY. Set false only if you really
      pointed it at a domain rather than a host.
    type: boolean
    default: { app: true }
    required: false
    secret: false
    tier: advanced
    source: user

  - name: MAILER_SMTP_RETRIES
    category: mailer
    description: gen_smtp connection retries per message.
    type: integer
    default: { app: 1 }
    required: false
    secret: false
    tier: internal
    source: user

