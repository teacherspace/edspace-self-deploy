    example: admin@school.example,head@school.example

  # ------------------------------------------------------------- retention
  # The nightly member-purge sweep and its tuning knobs are managed at
  # runtime on the backoffice Platform settings page (see `excluded:`). Only
  # the kill switch stays in the contract, as deployment-side break-glass:
  # stopping an irreversible deletion must not depend on the app's own DB
  # write path being healthy.
  - name: MEMBER_PURGE_ENABLED
    category: retention
    description: >-
      Deployment-side kill switch for the nightly member-purge sweep. Set
      "false" to stop it without a deploy — the worker then discards. The
      sweep runs only when neither this variable nor the backoffice Platform
      settings toggle disables it; a kill switch thrown in either place wins,
      and the backoffice cannot re-enable a sweep this variable disabled.
    type: boolean
    default: { app: true }
    required: false
    secret: false
    tier: advanced
    source: user

