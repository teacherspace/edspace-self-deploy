name: Release

# Tag vX.Y.Z == chart version. Publishes the chart as an OCI artifact to the
# customer registry. Image publication is handled by the app repo's pipeline.

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: registry.edspace.io
  CHART_REPO: edspace/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: azure/setup-helm@v4

      - name: Verify generated files and chart version match tag
        run: |
          uv run scripts/gen.py --check
          CHART_VERSION=$(awk '/^version:/{print $2}' chart/edspace/Chart.yaml)
          [ "v${CHART_VERSION}" = "${GITHUB_REF_NAME}" ] || {
            echo "Chart.yaml version ${CHART_VERSION} != tag ${GITHUB_REF_NAME}"; exit 1; }
          APP_VERSION=$(awk -F'"' '/^appVersion:/{print $2}' chart/edspace/Chart.yaml)
          case "$APP_VERSION" in
            ""|latest|*dev*) echo "Refusing release with unpinned appVersion: $APP_VERSION"; exit 1 ;;
          esac

      - name: Lint
        run: |
          for f in chart/edspace/ci/*.yaml; do helm lint chart/edspace -f "$f"; done
          bash scripts/test-chart-validation.sh

      - name: Package and push chart (OCI)
        run: |
          helm registry login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" -p "${{ secrets.REGISTRY_PASSWORD }}"
          helm package chart/edspace -d dist
          helm push dist/edspace-*.tgz "oci://$REGISTRY/$CHART_REPO"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/edspace-*.tgz
          generate_release_notes: true
