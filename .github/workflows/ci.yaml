name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Generated files are current
        run: uv run scripts/gen.py --check

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          # Pinned, and must match release.yaml and azure-pipelines-chart.yml.
          # Unpinned this tracks latest, so the helm that validates the chart
          # can drift a major version away from the one that packages the
          # artifact customers run, with nothing reporting the difference.
          version: v4.2.2
      - name: Lint against every ci values file
        run: |
          for f in chart/edspace/ci/*.yaml; do
            helm lint chart/edspace -f "$f"
          done
      - name: Reject unsafe and incomplete values
        run: bash scripts/test-chart-validation.sh
      - name: Render and validate manifests
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          for f in chart/edspace/ci/*.yaml; do
            helm template edspace chart/edspace -f "$f" \
              | ~/go/bin/kubeconform -strict -ignore-missing-schemas -summary
          done
      - name: Chart README is current (helm-docs)
        # helm-docs has no --validate flag; regenerate and diff instead.
        # Version pinned: the diff check is only stable against the version
        # that generated the committed README.
        run: |
          go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
          ~/go/bin/helm-docs --chart-search-root chart
          git diff --exit-code -- chart/edspace/README.md

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: |
          cp compose/.env.example compose/.env
          echo "POSTGRES_PASSWORD=ci-dummy" >> compose/.env
          echo "EDSPACE_IMAGE_TAG=v0.0.0-ci" >> compose/.env
          docker compose -f compose/compose.yaml --project-directory compose config -q

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build managed-app template
        env:
          EDSPACE_CONTAINER_IMAGE: edspace.azurecr.io/edspace/edspace:v0.0.0-ci
        run: |
          az bicep install
          cd marketplace/azure/managed-app && ./build.sh --no-zip

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # --severity=warning: the runner's apt shellcheck lags the version
          # devs run locally, and older releases emit info-level notes (SC2015
          # on intentional `guard && check || die`) that newer ones dropped.
          # Gating on warning+ keeps CI reproducible across that skew.
          shellcheck --severity=warning scripts/*.sh marketplace/azure/managed-app/*.sh \
            marketplace/azure/managed-app/test/*.sh
